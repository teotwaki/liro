# cargo-audit configuration.
# Reference: https://github.com/rustsec/cargo-audit

[advisories]
ignore = [
    # These advisories affect rustls and webpki. Both are transitive
    # dependencies inherited from serenity (through reqwest 0.12). Need a new
    # version of serenity before these can be removed.
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0349",
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0382",
]

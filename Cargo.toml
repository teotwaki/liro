[package]
name = "liro"
version = "0.11.1"
authors = ["Sebastian Lauwers <sl@mailicio.us"]
edition = "2024"

[dependencies]
dotenvy = "0.15"
log = "0.4"
pretty_env_logger = "0.5"
serde_json = "1.0"
thiserror = "2.0"

rand = "0.10"
pkce = "0.2"

regex = "1.5"
lazy_static = "1.4"
strum = "0.28"
strum_macros = "0.28"

mobc = "0.9"
mobc-redis = "0.9"

askama = "0.16"

[dependencies.poise]
version = "0.7.1"
# Keep Serenity cache and chrono disabled; TLS is selected below.
default-features = false

[dependencies.warp]
version = "0.4"
features = ["server"]

[dependencies.serenity]
version = "0.12.5"
default-features = false
features = [
  "client",
  "gateway",
  "rustls_backend",
  "model",
  "utils",
  "framework",
]

[dependencies.tokio]
version = "1"
features = ["macros", "rt-multi-thread", "signal"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls", "gzip", "brotli", "deflate", "json"]

[dev-dependencies]
serial_test = "4.0"

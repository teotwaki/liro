[package]
name = "liro"
version = "0.10.0"
authors = ["Sebastian Lauwers <sl@mailicio.us"]
edition = "2024"

[dependencies]
dotenv = "0.15"
log = "0.4"
pretty_env_logger = "0.5"
serde_json = "1.0"
thiserror = "2.0"

rand = "0.9"
pkce = "0.2"

regex = "1.5"
lazy_static = "1.4"
strum = "0.27"
strum_macros = "0.27"

mobc = "0.9"
mobc-redis = "0.9"

askama = "0.15"
futures = "0.3.31"

[dependencies.warp]
version = "0.4"
features = ["server"]

[dependencies.serenity]
version = "0.12"
default-features = false
features = [
  "client",
  "gateway",
  "rustls_backend",
  "model",
  "utils",
  "framework",
  "standard_framework",
  "unstable_discord_api",
]

[dependencies.tokio]
version = "1"
features = ["macros", "rt-multi-thread", "signal"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls", "gzip", "brotli", "deflate", "json"]

[dev-dependencies]
serial_test = "3.2"
